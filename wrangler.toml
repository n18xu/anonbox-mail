name = "anonbox-mail"
main = "src/worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

account_id = "d8f8d542de0893bd1b29a76f7b6dbe8d"

routes = [
  { pattern = "api.anonbox.email", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "anonbox-mail"
database_id = "574b7bfd-4895-4b18-807b-f2dbc289a80f"

[triggers]
crons = ["0 * * * *"]

[vars]
RETENTION_HOURS = "720"
VAPID_PUBLIC_KEY = "BGRdfWRgReTghnOXPnnb_iRKA23GmmT71WxQnSNKWswIi8p7jfarD5jDdxbeZzPk_NUuT2vVdQj6g_T0RGzbebU"
VAPID_SUBJECT = "mailto:admin@anonbox.email"

# Per-visitor limits for signup and login. The counters live only in Cloudflare's
# rate limiter memory; no IP address is written to the database.
[[ratelimits]]
name = "SIGNUP_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "LOGIN_LIMIT"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

# No persisted request logs: they would carry visitor IPs and headers
[observability]
enabled = false
